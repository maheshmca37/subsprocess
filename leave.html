<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TSP - Teacher Leave Entry</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { color-scheme: light; --primary:#175cd3; --border:#d7dce3; --muted:#667085; }
    * { box-sizing:border-box; }
    body { margin:0; padding:16px; background:#f3f6fb; color:#172033; font-family:Arial, sans-serif; }
    .wrap { max-width:620px; margin:0 auto; }
    .card { background:#fff; border:1px solid var(--border); border-radius:16px; padding:18px; box-shadow:0 3px 14px rgba(16,24,40,.06); }
    h1 { font-size:23px; margin:0 0 6px; }
    .sub { color:var(--muted); margin:0 0 18px; font-size:14px; line-height:1.45; }
    label.field-label { display:block; font-weight:700; margin:0 0 7px; }
    input[type=date] { width:100%; min-height:46px; padding:10px; border:1px solid var(--border); border-radius:10px; font-size:16px; background:#fff; }
    .list-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:20px 0 10px; }
    .list-head h2 { font-size:17px; margin:0; }
    #selectedCount { color:var(--muted); font-size:13px; white-space:nowrap; }
    #teacherList { display:flex; flex-direction:column; gap:8px; }
    .teacher-row { display:flex; align-items:center; gap:12px; min-height:52px; padding:11px 12px; border:1px solid var(--border); border-radius:11px; background:#fff; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    .teacher-row:has(input:checked) { border-color:var(--primary); background:#eff6ff; }
    .teacher-row input { width:22px; height:22px; flex:0 0 22px; accent-color:var(--primary); margin:0; }
    .teacher-name { font-size:16px; line-height:1.3; overflow-wrap:anywhere; }
    .actions { position:sticky; bottom:0; padding-top:14px; margin-top:14px; background:linear-gradient(transparent,#f3f6fb 18%); }
    button { width:100%; min-height:50px; border:0; border-radius:11px; background:var(--primary); color:#fff; font-size:16px; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.65; cursor:wait; }
    #status { min-height:20px; margin:12px 0 0; color:var(--muted); font-size:13px; line-height:1.4; }
    .empty { padding:16px; text-align:center; color:var(--muted); border:1px dashed var(--border); border-radius:10px; }
    @media (min-width:520px) { body { padding:28px 16px; } .card { padding:24px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Teacher Leave Entry</h1>
      <p class="sub">Choose the date, then tick every teacher who is on leave. Teachers are listed alphabetically. Your selections are saved in this browser on this device.</p>

      <label class="field-label" for="leaveDate">Leave date</label>
      <input id="leaveDate" type="date" required>

      <div class="list-head">
        <h2>Teachers on leave</h2>
        <span id="selectedCount">0 selected</span>
      </div>
      <div id="teacherList" aria-live="polite"><div class="empty">Loading teachers…</div></div>
      <div class="actions">
        <button id="gotoBtn" type="button">Goto Substitution</button>
        <p id="status" role="status">Select the teachers on leave, then continue.</p>
      </div>
    </section>
  </main>

  <script src="leave.js"></script>
</body>
</html>
